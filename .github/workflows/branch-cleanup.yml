name: Cleanup merged branches

on:
  schedule:
    # 매주 월요일 03:00 UTC(한국시간 낮 12시)
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: main에 이미 병합된 브랜치 삭제
        run: |
          git fetch origin --prune
          default_branch="${{ github.event.repository.default_branch }}"

          git branch -r --merged "origin/$default_branch" \
            | sed 's/^[* ]*//' \
            | grep '^origin/' \
            | sed 's#^origin/##' \
            | grep -vFx "$default_branch" \
            | grep -v ' ->' \
            | while read -r branch; do
                echo "삭제: $branch (이미 ${default_branch}에 병합됨)"
                git push origin --delete "$branch" || true
              done
