[project]
name = "disclosure-lit"
version = "0.1.0"
description = "공시 리터러시 어시스턴트 — 루머 팩트체크(DART 대조) + 상투 IR 화법 통계 사전"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.91",
    "anthropic>=0.49",
    "google-genai>=1.62",
    "pydantic>=2.11.5",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "streamlit>=1.63",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "tenacity>=9.1.4",
    "lxml>=6.1.3",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
# local cross-encoder reranker — heavy (torch); only needed for the rerank path
local = [
    "sentence-transformers>=3.2",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["disclosure_lit"]

# BGE-m3-ko 를 RTX 4070 에서 돌리기 위한 CUDA torch (기본 PyPI 는 CPU 전용).
# 실제 제약은 "cu124는 linux/win 휠만 있음"이라, 마커도 그 제약을 긍정 조건으로 그대로
# 적는다(PR #53 리뷰, @9abin 지적 — 이전엔 `!= darwin`으로 부정 조건이라 지원 안 되는
# 플랫폼을 새로 만날 때마다 예외를 하나씩 더 추가해야 하는 구조였다). 마커에 안 걸리는
# 플랫폼(macOS 등)은 PyPI 기본 torch(CPU/MPS 빌드)로 충분하다 — ASM-001(Apple M5 Max/
# MPS 실측)과 일치, macOS에서 마커 없이 `uv sync --extra local`이 무조건 실패하던 문제도
# 실측 확인(2026-09-14).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# PEP 695 type-param syntax — we keep the TypeVar style for parity with the
# reference projects (Tax_bot/rag).
ignore = ["UP047"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "llm: hits a real LLM API (skipped by default)",
    "slow: loads heavy local models (skipped by default)",
    "dart_integration: hits the real DART OpenAPI (skipped by default; run with -m dart_integration)",
]
addopts = "-m 'not llm and not slow and not dart_integration'"
